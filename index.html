<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<link rel="manifest" href="manifest.json">
<title>Gold GEX Levels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="px"><span id="price">–</span><span id="chg"></span></div>
  <div class="badges">
    <span id="regime" class="badge"></span>
    <span id="frozen" class="badge"></span>
  </div>
</header>
<p id="warn" class="warn" hidden></p>
<section class="stats" id="stats"></section>
<main>
  <div id="chart"></div>
  <aside id="ladder"></aside>
</main>
<section class="tablewrap">
  <table id="tbl">
    <thead><tr>
      <th>GLD strike</th><th>XAUUSD</th><th>Role</th><th>OI</th><th>Net GEX</th>
      <th>Gamma regime</th><th>IV skew</th><th>Call</th><th>Lean</th><th>Wrong if</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>
<footer id="note"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
