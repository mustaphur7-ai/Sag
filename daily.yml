name: Daily levels and deploy

on:
  schedule:
    # 01:00 UTC Mon-Fri = Tokyo open (00:00 UTC) + 1 hour. Edit together with config.json.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build levels (daily run or manual only)
        if: github.event_name != 'push'
        run: python scripts/build_levels.py
      - name: Commit levels.json
        if: github.event_name != 'push'
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add site/data/levels.json
          if ! git diff --cached --quiet; then
            git commit -m "levels $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
